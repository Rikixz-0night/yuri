[package]
name = "yuri"
version = "0.1.0"
edition = "2021"
authors = ["Rikixz <rikixz67@gmail.com>"]
description = "Blazing-fast asynchronous port scanner and OS fingerprinting engine written in Rust"
license = "MIT"
repository = "https://github.com/Rikixz-0night/yuri"
readme = "README.md"
keywords = ["port-scanner", "os-detection", "network", "security", "recon"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rlimit = "0.10"
ipnet = "2.9"
regex = "1.10"
futures = "0.3"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
